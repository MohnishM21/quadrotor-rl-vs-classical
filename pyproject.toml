[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quadrl"
version = "0.1.0"
description = "PPO quadrotor policy trained on a GPU port of quadbench, evaluated against PID, LQR, geometric and MPC"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "torch>=2.2",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "quadbench @ git+https://github.com/MohnishM21/quadrotor-control-benchmark.git",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
